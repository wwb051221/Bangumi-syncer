<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Bangumi-syncer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237db3ff'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%230f1115' font-family='sans-serif'%3EB%3C/text%3E%3C/svg%3E">
  <script>
    /* Apply the cached appearance before first paint (server values follow). */
    (function () {
      try {
        var root = document.documentElement;
        var cache = JSON.parse(localStorage.getItem('bs.ui.cache') || '{}');
        var query = new URLSearchParams(location.search).get('theme');
        var pref = query || cache.theme || 'auto';
        var resolved = pref === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : pref;
        root.dataset.theme = resolved;
        root.dataset.themePref = pref;
        root.dataset.density = cache.density || 'comfortable';
        if (cache.accent) root.style.setProperty('--accent', cache.accent);
        if (cache.font_scale) root.style.setProperty('--font-scale', cache.font_scale);
        var bg = cache.background || {};
        if (bg.mode && bg.mode !== 'none') {
          root.dataset.bg = bg.mode;
          if (bg.mode === 'preset') root.dataset.bgPreset = bg.preset || 'mist';
          if (bg.mode === 'image' && bg.url) root.style.setProperty('--bg-image', 'url("' + bg.url + '")');
          if (typeof bg.opacity === 'number') root.style.setProperty('--bg-opacity', bg.opacity);
          if (typeof bg.blur === 'number') root.style.setProperty('--bg-blur', bg.blur + 'px');
          if (typeof bg.dim === 'number') root.style.setProperty('--bg-dim', bg.dim);
        }
      } catch (err) { /* localStorage may be disabled */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>
  <div class="bg-scrim" id="bgScrim" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <span class="logo">B</span>
      <span class="title">Bangumi-syncer</span>
      <span id="version" class="muted"></span>
      <span id="modeBadge"></span>
    </div>
    <div class="meta">
      <span id="uptime" class="muted"></span>
      <span id="nextRun" class="muted"></span>
      <button class="btn" data-action="refresh" title="刷新数据">刷新</button>
      <button id="runBtn" class="btn primary" data-action="run">立即同步</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <a href="#overview" data-action="tab" data-tab="overview">概览</a>
    <a href="#review" data-action="tab" data-tab="review">待复核 <span class="pill" id="reviewCount">0</span></a>
    <a href="#mappings" data-action="tab" data-tab="mappings">映射</a>
    <a href="#accounts" data-action="tab" data-tab="accounts">账号</a>
    <a href="#logs" data-action="tab" data-tab="logs">日志</a>
    <a href="#settings" data-action="tab" data-tab="settings">设置</a>
  </nav>

  <main id="app">
    <div class="empty">加载中…</div>
  </main>

  <footer class="footer muted">
    <span id="footerInfo"></span>
    <span class="hide-sm">·· <a href="/api/status" target="_blank" rel="noreferrer">API</a> · <a href="/healthz" target="_blank" rel="noreferrer">health</a></span>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
